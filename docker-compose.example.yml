# Example compose file. If you already have your own docker-compose.yml
# for n8n elsewhere, just copy the `build:` block below into your existing
# n8n service definition (replacing any `image:` line) and adjust the
# context path to point at this project folder.
services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
